<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>content-creation editor</title>
<style>
:root{--bg:#FAF9F5;--card:#fff;--line:#E3E0D3;--ink:#141413;--mid:#5E5D59;--clay:#D97757;--clayD:#B5532F;--soft:#F8E6DD;--blue:#6A9BCC;--green:#788C5D}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:#fffd;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font:700 18px Lora,Georgia,serif;margin:0 12px 0 0}header .sp{flex:1}
button{font:600 14px inherit;font-family:inherit;border:1.5px solid var(--clay);background:#fff;color:var(--clayD);border-radius:999px;padding:7px 14px;cursor:pointer}
button.p{background:var(--clay);color:#fff}button:disabled{opacity:.5;cursor:wait}button.s{padding:4px 10px;font-size:13px}button.g{border-color:var(--line);color:var(--mid)}
main{display:grid;grid-template-columns:150px minmax(380px,1fr) minmax(300px,420px);gap:16px;padding:16px 18px;align-items:start}
nav{position:sticky;top:64px;display:flex;flex-direction:column;gap:6px}nav button{text-align:left;border-radius:12px;border-color:var(--line);color:var(--ink)}nav button.on{background:var(--soft);border-color:var(--clay);color:var(--clayD)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 12px}.card>h3{margin:0 0 8px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--mid)}
label{display:block;font-size:12px;color:var(--mid);margin:8px 0 2px}input,textarea,select{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:7px 9px;background:#fff;color:var(--ink)}textarea{min-height:60px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--clay);border-color:var(--clay)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:none}.itemhead{display:flex;gap:6px;align-items:center;margin-bottom:4px}.itemhead b{flex:1;font-size:13px}
.item{border-left:4px solid var(--clay);margin:8px 0;padding:6px 0 6px 10px;background:#fcfbf8;border-radius:0 10px 10px 0}
table{width:100%;border-collapse:collapse}td,th{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--mid);font-weight:600}td input{padding:5px 8px}
pre{white-space:pre-wrap;background:#141413;color:#eee;border-radius:12px;padding:10px;font-size:12px;max-height:240px;overflow:auto}
.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.thumbs img,.prev img,.prev video{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff}
.ok{color:var(--green);font-weight:600}.bad{color:var(--clayD);font-weight:600}small{color:var(--mid)}a{color:var(--clayD)}
@media(max-width:1000px){main{grid-template-columns:1fr}nav{position:static;flex-direction:row;flex-wrap:wrap}}
</style></head><body>
<header><h1>content-creation editor</h1><span id="proj" class="g"></span><span class="sp"></span>
<button id="bSave" class="p">Save &amp; check</button><button id="bBuild">Build carousel</button><button id="bGif">Build GIF + PNG</button><button id="bReel" class="g">Build Reel</button><button id="bPost" class="g">Build post</button></header>
<main><nav id="nav"></nav><section id="form"></section><aside><div class="card"><h3>Status</h3><div id="status"><small>Nothing run yet.</small></div><pre id="log" hidden></pre></div><div class="card"><h3>Preview</h3><div id="prev" class="prev"><small>Build something to see it here.</small></div></div></aside></main>
<script>
const TOKEN='__TOKEN__';let S=null,TAB='carousel';
const $=(s,p=document)=>p.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x==='text')e.textContent=v;else if(x.startsWith('on'))e[x]=v;else if(v!==false&&v!=null)e.setAttribute(x,v)}k.flat().forEach(c=>c!=null&&e.append(c));return e};
async function api(path,body){const r=await fetch(path+(path.includes('?')?'&':'?')+'t='+TOKEN,{method:body?'POST':'GET',headers:{'X-Token':TOKEN,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error(path+' '+r.status);return r.json()}
const ENUMS=k=>({type:S.slide_types,group:S.groups,icon:S.icons,hook_style:S.hook_styles,kind:['follow','comments'],template:S.templates}[k]);
const LONG=new Set(['sub','why','hook','big','body','text','say','q','label','head','note']);
function setAt(o,path,v){let c=o;for(let i=0;i<path.length-1;i++)c=c[path[i]];c[path[path.length-1]]=v}
function field(parent,obj,key,path,label){
  const v=obj[key],p=[...path,key],name=label||String(key);
  if(Array.isArray(v)){const box=el('div',{class:'card'},el('h3',{text:name}));
    const redraw=()=>{box.replaceChildren(el('h3',{text:name+' ('+v.length+')'}));
      v.forEach((it,i)=>{const prim=typeof it!=='object'||it===null;
        if(prim){const r=el('div',{class:'row'});field(r,v,i,path.concat([key]),'');r.append(btn('↑',()=>{if(i){[v[i-1],v[i]]=[v[i],v[i-1]];redraw()}}),btn('↓',()=>{if(i<v.length-1){[v[i+1],v[i]]=[v[i],v[i+1]];redraw()}}),btn('✕',()=>{v.splice(i,1);redraw()}));box.append(r)}
        else{const hd=el('div',{class:'itemhead'},el('b',{text:'#'+(i+1)+' '+(it.title||it.name||it.label||it.head||it.type||'')}),btn('↑',()=>{if(i){[v[i-1],v[i]]=[v[i],v[i-1]];redraw()}}),btn('↓',()=>{if(i<v.length-1){[v[i+1],v[i]]=[v[i],v[i+1]];redraw()}}),btn('copy',()=>{v.splice(i+1,0,JSON.parse(JSON.stringify(it)));redraw()}),btn('✕',()=>{v.splice(i,1);redraw()}));
          const w=el('div',{class:'item'},hd);for(const k of Object.keys(it))field(w,it,k,[...path,key,i]);box.append(w)}});
      box.append(btn('+ add',()=>{const t=v[v.length-1];v.push(t===undefined?'':typeof t==='object'?blank(t):'');redraw()},'s g'))};
    redraw();parent.append(box);return}
  if(v&&typeof v==='object'){const box=el('div',{class:'card'},el('h3',{text:name}));for(const k of Object.keys(v))field(box,v,k,p);parent.append(box);return}
  const en=ENUMS(key);let inp;
  if(en){inp=el('select');en.forEach(o=>inp.append(el('option',{value:o,text:o,selected:o===v})));if(!en.includes(v))inp.prepend(el('option',{value:v,text:String(v),selected:true}))}
  else if(typeof v==='number'){inp=el('input',{type:'number',value:v})}
  else if(typeof v==='boolean'){inp=el('select');['true','false'].forEach(o=>inp.append(el('option',{value:o,text:o,selected:String(v)===o})))}
  else if(LONG.has(String(key))||String(v).length>60){inp=el('textarea');inp.value=v}
  else{inp=el('input',{type:'text',value:v})}
  const cnt=el('small',{text:typeof v==='string'?v.length+' chars':''});
  inp.oninput=()=>{const nv=typeof v==='number'?(inp.value===''?0:+inp.value):typeof v==='boolean'?inp.value==='true':inp.value;obj[key]=nv;if(typeof nv==='string')cnt.textContent=nv.length+' chars'};
  parent.append(name===''?inp:el('div',{},el('label',{text:name}),inp,cnt))}
const blank=o=>Array.isArray(o)?o.map(x=>typeof x==='object'?blank(x):''):Object.fromEntries(Object.entries(o).map(([k,x])=>[k,typeof x==='object'&&x!==null?blank(x):typeof x==='number'?0:(['icon','group','type'].includes(k)?x:'')]));
function btn(t,f,c=''){return el('button',{class:'s g '+c,onclick:f,text:t,type:'button'})}
function render(){
  const nav=$('#nav');nav.replaceChildren();const tabs=[['carousel','Carousel'],['gif','GIF'],['beats','Reel script'],['scenes','Reel scenes'],['post','Post'],['brand','Brand & CTA'],['meta','Project']].filter(([k])=>k==='brand'||k==='meta'||S.story[k]!==undefined);
  tabs.forEach(([k,l])=>nav.append(el('button',{class:k===TAB?'on':'',text:l,onclick:()=>{TAB=k;render()}})));
  $('#proj').textContent=S.work;const f=$('#form');f.replaceChildren();
  if(TAB==='brand')return brandForm(f);
  if(TAB==='carousel')ctaTable(f);
  if(TAB==='meta'){const c=el('div',{class:'card'},el('h3',{text:'meta'}));for(const k of Object.keys(S.story.meta))field(c,S.story.meta,k,['meta']);f.append(c);return}
  const sec=S.story[TAB];if(Array.isArray(sec)){field(f,S.story,TAB,[],TAB)}else for(const k of Object.keys(sec))field(f,sec,k,[TAB]);
  if(TAB==='carousel')hookHelp(f);preview()}
function hookHelp(f){const st=S.story.carousel.hook_style;f.append(el('div',{class:'card'},el('h3',{text:'Hook style: '+st}),el('small',{text:S.hook_help[st]||''})))}
function ctaTable(f){const d=S.deck;if(!d.length)return;const t=el('table',{},el('tr',{},el('th',{text:'#'}),el('th',{text:'Slide'}),el('th')));
  d.forEach(r=>t.append(el('tr',{},el('td',{text:r.n}),el('td',{text:r.type}),el('td',{},btn('rebuild slide',()=>buildArt('carousel',r.n),'s')))));
  f.append(el('div',{class:'card'},el('h3',{text:'Slides (rebuild one at a time). Every slide carries your brand CTA; change it under Brand.'}),t))}
function setPath(p,v){const t=[...p.matchAll(/([A-Za-z_][\w-]*)|\[(\d+)\]/g)].map(m=>m[1]!==undefined?m[1]:+m[2]);let c=S.story;for(let i=0;i<t.length-1;i++){if(c[t[i]]===undefined)c[t[i]]={};c=c[t[i]]}c[t[t.length-1]]=v}
function brandForm(f){const b=S.brand,c=el('div',{class:'card'},el('h3',{text:'Brand (used by every GIF, Reel and carousel)'}));const o={name:b.name,tagline:b.tagline,follow:b.follow||'Follow'};
  for(const k of Object.keys(o))field(c,o,k,[]);c.append(el('div',{class:'row'},btn('Save brand',async()=>{const r=await api('/api/brand',o);show(r.ok,r.log);await load()},'p')),el('small',{text:'Avatar: run  studio.py brand --avatar FILE . Changes apply to the next build.'}));f.append(c)}
function show(ok,log){$('#status').replaceChildren(el('span',{class:ok?'ok':'bad',text:ok?'OK':'Needs attention'}));const p=$('#log');p.hidden=!log;p.textContent=log||''}
async function save(){const r=await api('/api/save',{story:S.story});show(r.ok,r.log);return r.ok}
async function buildArt(a,slide){busy(true);try{if(!await save()){busy(false);return}show(true,'building '+a+(slide?' (slide '+slide+')':'')+' ... this can take a while');const r=await api('/api/build',{artifacts:a,slide:slide||null});show(r.ok,r.log);await load()}catch(e){show(false,String(e))}busy(false)}
function busy(b){document.querySelectorAll('header button').forEach(x=>x.disabled=b)}
function preview(){const p=$('#prev');p.replaceChildren();const o=S.outputs,pics=o.filter(x=>/carousel\/.*\.png$/.test(x.path)),v=x=>'/file/'+x.path+'?t='+TOKEN+'&m='+x.mtime;
  if(TAB==='carousel'||!pics.length&&false){const g=el('div',{class:'thumbs'});pics.forEach(x=>g.append(el('a',{href:v(x),target:'_blank'},el('img',{src:v(x),alt:x.path}))));p.append(g)}
  o.filter(x=>/\.(gif|mp4|pdf|txt)$/.test(x.path)&&!/review/.test(x.path)).forEach(x=>{if(TAB==='carousel'&&!/(pdf|comment\.txt)$/.test(x.path))return;
    if(x.path.endsWith('.mp4'))p.append(el('video',{src:v(x),controls:true}));else if(x.path.endsWith('.gif'))p.append(el('img',{src:v(x)}));else p.append(el('div',{},el('a',{href:v(x),target:'_blank',text:x.path.split('/').pop()})))});
  if(TAB!=='carousel')o.filter(x=>/linkedin\.png$/.test(x.path)&&!/carousel/.test(x.path)).forEach(x=>p.append(el('img',{src:v(x)})))}
async function load(){S=await api('/api/state');render()}
$('#bSave').onclick=async()=>{busy(true);await save();await load();busy(false)};
$('#bBuild').onclick=()=>buildArt('carousel');$('#bGif').onclick=()=>buildArt('gif');$('#bReel').onclick=()=>buildArt('reel');$('#bPost').onclick=()=>buildArt('post');
load().catch(e=>show(false,String(e)));
</script></body></html>
