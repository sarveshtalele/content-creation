<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explainer Studio</title>
<style>

:root{--rail:#0F1A2E;--railLine:#22314D;--railInk:#C9D3E8;--bg:#F5F6F8;--panel:#fff;--ink:#0F1A2E;--mid:#5B6779;--line:#E2E6ED;--lineD:#C8CFDB;--blue:#2A4FE0;--blueD:#1B3AB8;--blueS:#E8EDFD;--ok:#17803D;--okS:#DDF3E4;--warn:#9A5B00;--warnS:#FFF0D1;--bad:#B3261E;--badS:#FDE6E4;--r:10px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}

.fan img:hover{transform:translateY(-8px) rotate(0);z-index:5}

.btn.pri{background:var(--blue);border-color:var(--blue)}.btn.pri:hover{background:var(--blueD)}.btn.ghost{background:#fff;color:var(--ink);border-color:var(--lineD)}.btn.ghost:hover{border-color:var(--ink)}.btn.sm{padding:6px 12px;font-size:13.5px;white-space:nowrap;flex:none}.btn:disabled{background:#C8CFDB;border-color:#C8CFDB;color:#fff;cursor:not-allowed}
.work{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:clamp(18px,3vw,40px);align-items:start}

@media(max-width:820px){body{grid-template-columns:1fr}nav.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.rail h6,.rail .foot,.rail .sp{display:none}.brand{border:0;margin:0;padding:0 8px}}

.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.poster{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:block}.poster .sheet{display:block;position:relative;aspect-ratio:4/5;border-radius:8px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 14px 24px -16px rgba(15,26,46,.45);transition:transform .2s}

.proof{position:sticky;top:20px;padding:14px}.proof img.big{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:6px;display:block;background:var(--bg);border:1px solid var(--line)}.proof h3{margin:12px 0 2px;font-size:16px}.proof p{margin:0 0 8px;color:var(--mid);font-size:14px}.proof .fit{font-size:13px;background:var(--blueS);color:var(--blueD);border-radius:6px;padding:6px 10px}
.deck{display:grid;gap:6px;margin:0 0 16px}.deckrow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px}.deckrow img{width:34px;height:42px;object-fit:cover;border-radius:4px}.deckrow span{flex:1;font-weight:500}.deckrow button{border:0;background:none;color:var(--mid);cursor:pointer}.deckrow button:hover{color:var(--bad)}

.fld{margin:0 0 12px}.fld>label{display:flex;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:4px}.fld .cnt{font-weight:400;color:var(--mid);font-size:12.5px}.fld .cnt.over{color:var(--bad);font-weight:700}.fld>label.toggle{justify-content:flex-start}.fld .hint{color:var(--mid);font-size:12.5px;margin:2px 0 0}

.toggle{display:flex;gap:10px;align-items:center;font-weight:600}.toggle input{width:18px;height:18px;accent-color:var(--blue)}

.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:16px}.results figure{margin:0}.results img{width:100%;border-radius:8px;border:1px solid var(--line);display:block}.results figcaption{margin-top:6px;font-size:13px}
.msg{border-radius:8px;padding:11px 14px;margin:12px 0}.msg.err{background:var(--badS);color:var(--bad)}.msg.ok{background:var(--okS);color:var(--ok)}.msg.busy{background:var(--blueS);color:var(--blueD)}
pre{white-space:pre-wrap;background:var(--rail);color:#E7ECFF;border-radius:8px;padding:12px;font-size:12px;max-height:260px;overflow:auto}details{margin-top:8px}
dialog{border:0;border-radius:14px;padding:0;max-width:880px;width:calc(100% - 28px);box-shadow:0 30px 80px rgba(15,26,46,.45)}dialog::backdrop{background:rgba(15,26,46,.5)}.dlg{padding:22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}@media(max-width:700px){.dlg{grid-template-columns:1fr}}
.dlg .pv{background:var(--bg);border-radius:8px;display:grid;place-items:center;min-height:260px;overflow:hidden}.dlg .pv img,.dlg .pv video{max-width:100%;max-height:60vh;display:block}
.files{list-style:none;margin:12px 0;padding:0;display:grid;gap:6px}.files li{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13.5px;word-break:break-all}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start}
.hooks{border:1px solid var(--line);background:var(--blueS);border-radius:8px;padding:10px 12px;margin:0 0 10px}.hooks h4{margin:0 0 6px;font-size:13.5px}.hooks .best{display:grid;gap:5px}.hooks button.h{display:block;text-align:left;border:1px solid var(--lineD);background:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:14px;width:100%}.hooks button.h:hover{border-color:var(--blue)}.hooks button.h small{color:var(--mid);display:block;font-size:12px}.hooks .cat{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.link{border:0;background:none;color:var(--blueD);font-weight:600;cursor:pointer;padding:0;font-size:13px}.note{color:var(--mid);font-size:12.5px;margin:6px 0 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<script>
const TOKEN='__TOKEN__';const $=(s,p=document)=>p.querySelector(s);const $$=(s,p=document)=>[...p.querySelectorAll(s)];

const byId=id=>D.designs.find(d=>d.id===id),clone=o=>JSON.parse(JSON.stringify(o));

 const tpl=TEMPLATES.map(id=>el('img',{src:u('/samples/'+id+'.jpg'),alt:byId(id).name+' infographic'}));
 m.append(el('section',{class:'hero'},el('div',{},el('h1',{text:'Turn an idea into something people stop for.'}),el('p',{class:'lede',text:'Choose the infographics, fill in your words and get a finished carousel (PDF and images), infographic, GIF, post or Reel. Everything is made on this computer with your branding.'}),el('div',{class:'bar'},el('a',{class:'btn pri',href:'#/create/carousel',text:'Create a carousel'}),el('a',{class:'btn ghost',href:'#/library',text:'Open the library'}))),el('div',{class:'fan',role:'img','aria-label':'Sample infographics'},tpl)));

 const rec=el('div');m.append(el('div',{class:'sechead'},el('h2',{text:'Recently made'}),el('a',{href:'#/library',text:'See all'})),rec);

function card(i){const th=el('span',{class:'th'});if(i.thumb)th.append(el('img',{src:u('/lib/'+i.thumb),alt:'',loading:'lazy'}));else th.append(svg(i.kind));
 return el('button',{class:'item',type:'button',onclick:()=>open(i)},th,el('span',{class:'bd'},el('b',{text:i.title}),el('small',{text:i.label+' · '+ago(i.when)+(i.files.length>1?' · '+i.files.length+' files':'')})))}
