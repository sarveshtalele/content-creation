<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explainer Studio</title>
<style>
@font-face{font-family:Inter;font-weight:400;src:url(/fonts/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:500;src:url(/fonts/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;src:url(/fonts/inter-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:700;src:url(/fonts/inter-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Lora;font-weight:600;src:url(/fonts/lora-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Lora;font-weight:700;src:url(/fonts/lora-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(/fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2")}
:root{--bg:#FAF9F5;--panel:#FFFFFF;--sand:#F0EEE6;--ink:#141413;--mid:#5E5D59;--line:#E3E0D3;--lineD:#C9C5B5;--clay:#D97757;--clayD:#A8481F;--clayS:#F8E6DD;--blue:#3C6C9C;--blueS:#E4EDF6;--green:#52663A;--greenS:#E8EEDD;--bad:#A8341F;--badS:#FBE3DC;--rail:#1F1E1B;--railInk:#D9D5C7;--r:18px;--rs:12px;--sh:0 1px 0 var(--line),0 18px 36px -22px rgba(20,20,19,.35)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
:focus-visible{outline:3px solid var(--clay);outline-offset:2px;border-radius:8px}
button,select,input,textarea{font:inherit;color:inherit}a{color:var(--clayD)}
nav.rail{background:var(--rail);color:var(--railInk);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 18px;border-bottom:1px solid #34322D;margin-bottom:10px}.brand img{width:40px;height:40px;border-radius:12px;object-fit:cover}.brand b{display:block;color:#fff;font:700 16px/1.15 Inter}.brand small{color:#A39E8F;font-size:12.5px}
.rail h6{margin:16px 10px 4px;font:600 11.5px/1 Inter;color:#8C877A;letter-spacing:.08em;text-transform:uppercase}
.rail a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;color:var(--railInk);text-decoration:none;font-weight:500}.rail a:hover{background:#2C2A26}.rail a[aria-current=page]{background:var(--clay);color:#fff;font-weight:600}
.rail svg,.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail .sp{flex:1}.rail .foot{font-size:12.5px;color:#8C877A;padding:10px;border-top:1px solid #34322D}
main{padding:clamp(20px,3.2vw,44px);max-width:1360px;width:100%}
h1{margin:0 0 6px;font:700 clamp(28px,3.4vw,42px)/1.1 Lora,serif;letter-spacing:-.015em}h2{margin:0 0 4px;font:600 20px/1.25 Inter}h3{margin:0 0 4px;font:600 17px/1.3 Inter}
.lede{color:var(--mid);margin:0 0 26px;max-width:70ch;font-size:16px}.muted{color:var(--mid)}.note{color:var(--mid);font-size:13px;margin:6px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}.pad{padding:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.stack{display:grid;gap:14px}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(18px,3vw,36px);align-items:start}@media(max-width:1100px){.two{grid-template-columns:1fr}}
.btn{border:1px solid var(--ink);border-radius:999px;padding:10px 20px;font-weight:600;cursor:pointer;background:var(--ink);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:8px}.btn:hover{background:#34322D}
.btn.pri{background:var(--clay);border-color:var(--clay)}.btn.pri:hover{background:var(--clayD)}.btn.ghost{background:#fff;color:var(--ink);border-color:var(--lineD)}.btn.ghost:hover{border-color:var(--ink)}.btn.sm{padding:6px 13px;font-size:13.5px}.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:600;background:var(--sand);color:var(--mid);border:1px solid var(--line)}.chip.clay{background:var(--clayS);color:var(--clayD);border-color:#F0C9B8}.chip.ok{background:var(--greenS);color:var(--green);border-color:#CFDABF}.chip.blue{background:var(--blueS);color:var(--blue);border-color:#C9DAEC}.chip.bad{background:var(--badS);color:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 22px;border-bottom:1px solid var(--line)}.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--mid);cursor:pointer}.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--clay)}
.steps{counter-reset:s;display:grid;gap:22px}.step>h2::before{counter-increment:s;content:counter(s);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--clay);color:#fff;font:700 14px Inter;margin-right:10px;vertical-align:2px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px 16px}
.pick{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:block;position:relative}.pick .sheet{display:block;position:relative;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);transition:transform .18s}
.pick.tall .sheet{aspect-ratio:9/16}.pick img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}.pick:hover .sheet{transform:translateY(-4px)}.pick[aria-pressed=true] .sheet{outline:3px solid var(--clay);outline-offset:3px}
.pick strong{display:block;margin-top:9px;font-size:15px;line-height:1.25}.pick small{display:block;color:var(--mid);font-size:12.5px;line-height:1.35}
.pick .rank{position:absolute;left:10px;top:10px;z-index:2;background:var(--ink);color:#fff;border-radius:999px;font:700 12px Inter;padding:3px 9px}.pick .rank.top{background:var(--clay)}
.meter{height:6px;border-radius:3px;background:var(--sand);margin-top:6px;overflow:hidden}.meter i{display:block;height:100%;border-radius:3px;background:var(--clay)}
.fld{margin:0 0 12px}.fld>label{display:flex;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:4px}.fld .cnt{font-weight:400;color:var(--mid);font-size:12.5px}.fld .cnt.over{color:var(--bad);font-weight:700}
input[type=text],input[type=url],input[type=number],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--lineD);border-radius:var(--rs);background:#fff}input:focus,select:focus,textarea:focus{border-color:var(--clay);outline:none;box-shadow:0 0 0 3px var(--clayS)}textarea{min-height:110px;resize:vertical}textarea.code{font:13px/1.5 'JetBrains Mono',monospace;min-height:220px}
.hooks{display:grid;gap:8px}.hooks button{display:block;text-align:left;border:1px solid var(--line);background:#fff;border-radius:var(--rs);padding:10px 12px;cursor:pointer}.hooks button:hover{border-color:var(--clay)}.hooks button[aria-pressed=true]{border-color:var(--clay);background:var(--clayS)}.hooks small{display:block;color:var(--mid);font-size:12px}
.shapes{display:flex;gap:8px;flex-wrap:wrap}.reco{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.reco .card{padding:16px}.reco b{display:block;margin-bottom:4px}.reco ol{margin:6px 0 10px;padding-left:20px}.reco li{margin:2px 0}
.deck{display:grid;gap:8px}.deckrow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--rs);padding:8px 12px}.deckrow img{width:36px;height:45px;object-fit:cover;border-radius:6px}.deckrow span{flex:1;font-weight:500}.deckrow button{border:0;background:none;color:var(--bad);cursor:pointer;font-weight:600}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:14px}.results figure{margin:0}.results img,.results video{width:100%;border-radius:12px;border:1px solid var(--line);display:block;background:#fff}.results figcaption{margin-top:6px;font-size:13px}
.msg{border-radius:var(--rs);padding:11px 14px;margin:12px 0}.msg.err{background:var(--badS);color:var(--bad)}.msg.ok{background:var(--greenS);color:var(--green)}.msg.busy{background:var(--blueS);color:var(--blue)}
pre{white-space:pre-wrap;background:var(--rail);color:#EDE9DD;border-radius:var(--rs);padding:12px;font-size:12.5px;max-height:280px;overflow:auto}
.wsteps{display:grid;gap:10px}.wstep{display:grid;grid-template-columns:28px 170px repeat(3,minmax(0,1fr));gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--rs);padding:10px}
.wstep>:nth-child(3){grid-column:3/5}.wstep>:nth-child(7){grid-column:5;grid-row:1;justify-self:end}.wstep>:nth-child(4){grid-column:2/4;grid-row:2}.wstep>:nth-child(5){grid-column:4;grid-row:2}.wstep>:nth-child(6){grid-column:5;grid-row:2}.wstep b{color:var(--clayD);text-align:center}.wstep button{border:0;background:none;color:var(--bad);cursor:pointer}
@media(max-width:900px){.wstep{grid-template-columns:24px 1fr}.wstep>*:nth-child(n+2){grid-column:2!important;grid-row:auto!important;justify-self:stretch}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.item{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:block;width:100%;box-shadow:var(--sh)}.item:hover{border-color:var(--clay)}
.item .th{aspect-ratio:4/3;background:var(--sand);display:grid;place-items:center;overflow:hidden}.item .th img{width:100%;height:100%;object-fit:cover;object-position:top}.item .bd{padding:12px 14px}.item b{display:block;font-size:15px;line-height:1.3;margin-bottom:4px}.item small{color:var(--mid);font-size:13px}
.empty{border:1px dashed var(--lineD);border-radius:var(--r);padding:30px;text-align:center;color:var(--mid);background:#fff}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center;margin-bottom:30px}@media(max-width:900px){.hero{grid-template-columns:1fr}}
.fan{position:relative;height:clamp(280px,32vw,420px)}.fan img{position:absolute;height:88%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;box-shadow:var(--sh);border:1px solid var(--line);background:#fff}
.fan img:nth-child(1){left:0;top:6%;transform:rotate(-5deg)}.fan img:nth-child(2){left:17%;top:0;transform:rotate(-1.5deg);z-index:1}.fan img:nth-child(3){left:34%;top:4%;transform:rotate(2deg);z-index:2}.fan img:nth-child(4){left:51%;top:9%;transform:rotate(5deg);z-index:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:30px}.tile{display:block;text-decoration:none;color:inherit;padding:18px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}.tile:hover{border-color:var(--clay)}.tile .ic{width:26px;height:26px;color:var(--clay);margin-bottom:8px}.tile b{display:block;font-size:16.5px}.tile span{color:var(--mid);font-size:14px}
dialog{border:0;border-radius:20px;padding:0;max-width:900px;width:calc(100% - 28px);box-shadow:0 30px 80px rgba(20,20,19,.45)}dialog::backdrop{background:rgba(20,20,19,.5)}.dlg{padding:22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}@media(max-width:700px){.dlg{grid-template-columns:1fr}}
.dlg .pv{background:var(--sand);border-radius:14px;display:grid;place-items:center;min-height:260px;overflow:hidden}.dlg .pv img,.dlg .pv video{max-width:100%;max-height:62vh;display:block}
.files{list-style:none;margin:12px 0;padding:0;display:grid;gap:6px}.files li{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:var(--rs);padding:6px 10px;font-size:13.5px;word-break:break-all}
@media(max-width:820px){body{grid-template-columns:1fr}nav.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.rail h6,.rail .foot,.rail .sp{display:none}.brand{border:0;margin:0;padding:0 8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<nav class="rail" aria-label="Main">
 <div class="brand"><img src="/avatar" alt=""><div><b>Explainer Studio</b><small id="who"></small></div></div>
 <h6>Start</h6>
 <a href="#/home" data-r="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
 <a href="#/library" data-r="library"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="2"/><rect x="14" y="4" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Library</a>
 <h6>Media</h6>
 <a href="#/gif" data-r="gif"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M8 10v4M12 10v4M16 10h-2v4"/></svg>GIF</a>
 <a href="#/carousel" data-r="carousel"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="3"/><path d="M3 8v8M21 8v8"/></svg>Carousel</a>
 <a href="#/reel" data-r="reel"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="3"/><path d="M11 10l3 2-3 2z"/></svg>Reel</a>
 <a href="#/cover" data-r="cover"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M9 8h6M9 12h4"/></svg>Reel cover</a>
 <a href="#/walkthrough" data-r="walkthrough"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.6L10 19z"/></svg>Walkthrough video</a>
 <a href="#/post" data-r="post"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Post</a>
 <h6>Help</h6>
 <a id="catLink" href="/catalog" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><path d="M13 17h8M17 13v8"/></svg>Design catalogue</a>
 <div class="sp"></div><div class="foot">Runs on this computer only. Nothing is uploaded.</div>
</nav>
<main id="view" tabindex="-1"></main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<script>window.TOKEN='__TOKEN__'</script>
<script type="module" src="/js/app.js"></script>
</body></html>
