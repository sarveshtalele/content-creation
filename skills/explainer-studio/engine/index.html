<!doctype html>
<html><head><meta charset="utf-8"><title>Explainer</title>
<style>
@font-face{font-family:Lora;font-weight:500;src:url(assets/fonts/lora-latin-500-normal.woff2)}
@font-face{font-family:Lora;font-weight:600;src:url(assets/fonts/lora-latin-600-normal.woff2)}
@font-face{font-family:Lora;font-weight:700;src:url(assets/fonts/lora-latin-700-normal.woff2)}
@font-face{font-family:Lora;font-weight:500;font-style:italic;src:url(assets/fonts/lora-latin-500-italic.woff2)}
@font-face{font-family:Inter;font-weight:400;src:url(assets/fonts/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(assets/fonts/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(assets/fonts/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(assets/fonts/inter-latin-700-normal.woff2)}
@font-face{font-family:Excalifont;font-weight:400;src:url(assets/fonts/excalifont-latin-400-normal.woff2)}
@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(assets/fonts/jetbrains-mono-latin-400-normal.woff2)}
@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(assets/fonts/jetbrains-mono-latin-500-normal.woff2)}
@font-face{font-family:'JetBrains Mono';font-weight:700;src:url(assets/fonts/jetbrains-mono-latin-700-normal.woff2)}
html,body{margin:0;padding:0;background:#FAF9F5;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background-color:#FAF9F5;
  background-image:radial-gradient(#E4E1D4 2px,transparent 2.3px);background-size:54px 54px;background-position:27px 27px}
.abs{position:absolute}.sans{font-family:Inter,sans-serif}.serif{font-family:Lora,serif}.mono{font-family:'JetBrains Mono',monospace}.hand{font-family:Excalifont,'Comic Sans MS',cursive}
.scene{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;will-change:transform,opacity}
.tx{box-sizing:border-box}
#stage svg path,#stage svg polygon,#stage svg rect,#stage svg line,#stage svg polyline{stroke-linejoin:round}
#cap{position:absolute;left:90px;width:900px;display:flex;align-items:center;justify-content:center;opacity:0}
#capin{font-family:Inter,sans-serif;font-weight:600;color:#141413;text-align:center;background:#fff;border:2.5px solid #C9C5B5;box-shadow:0 8px 0 #E3E0D3;box-sizing:border-box;border-radius:36px}
</style></head>
<body><div id="stage"></div><script type="module" src="main.js"></script></body></html>
