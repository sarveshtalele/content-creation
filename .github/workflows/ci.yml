name: CI
on:
  push:
    branches: [main, v3]
  pull_request:
permissions: { contents: read }
concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }
env:
  PYTHONIOENCODING: utf-8
jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.py }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        py: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.py }}' }
      - name: Unit, portability and security tests
        run: |
          python skills/content-creation/tests/test_platform.py
          python skills/content-creation/tests/test_security.py
          python skills/content-creation/tests/test_studio.py
          python skills/content-creation/tests/test_content.py
          python skills/content-creation/tests/test_matrix.py
          python skills/content-creation/tests/test_gates.py
          python skills/content-creation/scripts/logos.py
      - name: Offline self-test (every fixture; an unapproved build is refused)
        run: python skills/content-creation/scripts/selftest.py
      - name: Installer (install, upgrade from 3.x, hooks, uninstall, in a throwaway home)
        run: python skills/content-creation/tests/test_install.py
      - name: Packages
        run: |
          python install.py zip
          python install.py status

  render:
    name: render / ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Runtime (headless Chromium, ffmpeg)
        shell: bash
        run: |
          cd skills/content-creation/runtime && npm install --no-audit --no-fund --silent && node node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell
          cd ../../.. && npm install --no-audit --no-fund --silent --prefix "$RUNNER_TEMP/ff" ffmpeg-static
          mkdir -p "$HOME/.cache/content-creation/bin"
          cp "$RUNNER_TEMP/ff/node_modules/ffmpeg-static/ffmpeg"* "$HOME/.cache/content-creation/bin/"
      - name: End-to-end renders (GIFs incl. stage panels, architecture slides, newsletter banner) with review gates
        shell: bash
        run: python skills/content-creation/tests/e2e/run_all.py --only gif,arch,banner --no-app --out "$RUNNER_TEMP/showcase"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/showcase/REPORT.md
            ${{ runner.temp }}/showcase/gif/**/*.png
            ${{ runner.temp }}/showcase/banner/*.png
          if-no-files-found: ignore
          retention-days: 7
