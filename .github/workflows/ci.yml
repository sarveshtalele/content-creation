name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  portable:
    name: ${{ matrix.os }} / py${{ matrix.py }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        py: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.py }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Portability and security tests
        run: |
          python skills/explainer-studio/tests/test_platform.py
          python skills/explainer-studio/tests/test_security.py
          python skills/explainer-studio/tests/test_studio.py
          python skills/explainer-studio/tests/test_content.py
      - name: Offline self-test (ingest, check, pick, post for every fixture)
        run: python skills/explainer-studio/scripts/selftest.py
      - name: Installer
        run: python install.py --zip
      - name: Render a GIF end to end (headless browser, no voice model)
        if: matrix.py == '3.13'
        shell: bash
        run: |
          cd skills/explainer-studio/runtime && npm install --no-audit --no-fund --silent && node node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell
          cd ../../.. && npm install --no-audit --no-fund --silent --prefix "$RUNNER_TEMP/ff" ffmpeg-static
          mkdir -p "$HOME/.cache/explainer-studio/bin"
          cp "$RUNNER_TEMP/ff/node_modules/ffmpeg-static/ffmpeg"* "$HOME/.cache/explainer-studio/bin/"
          W="$RUNNER_TEMP/w"; python skills/explainer-studio/scripts/studio.py ingest skills/explainer-studio/fixtures/pipeline.md --out "$W"
          cp skills/explainer-studio/fixtures/pipeline.story.json "$W/story.json"
          python skills/explainer-studio/scripts/studio.py build "$W" --artifacts gif
          C="$RUNNER_TEMP/c"; python skills/explainer-studio/scripts/studio.py ingest skills/explainer-studio/fixtures/carousel.md --out "$C"
          cp skills/explainer-studio/fixtures/carousel.story.json "$C/story.json"
          python skills/explainer-studio/scripts/studio.py build "$C" --artifacts carousel --format both
          python skills/explainer-studio/scripts/studio.py e2e "$C"
          G="$RUNNER_TEMP/g"; python skills/explainer-studio/scripts/studio.py ingest skills/explainer-studio/fixtures/grid.md --out "$G"
          cp skills/explainer-studio/fixtures/grid.story.json "$G/story.json"
          python skills/explainer-studio/scripts/studio.py build "$G" --artifacts gif
          test -s "$C"/out/*-carousel.pdf && ls "$C"/out/carousel/*.png | wc -l
